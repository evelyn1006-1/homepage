<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Dog Break</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
      @font-face {
        font-family: "Comic Neue";
        src: url("{{ url_for('static', filename='fonts/comic-neue-regular.woff2') }}") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Comic Neue";
        src: url("{{ url_for('static', filename='fonts/comic-neue-bold.woff2') }}") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Comic Neue", "Comic Sans MS", cursive;
        background: radial-gradient(circle at top, #ffe6ef, #f7d7e4 45%, #f2c6da 80%);
        color: #3b1f2b;
      }

      .card {
        max-width: 720px;
        width: 100%;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 26px;
        padding: 28px;
        box-shadow: 0 26px 80px rgba(89, 25, 55, 0.18);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 18px;
        color: #593548;
      }

      .frame {
        background: linear-gradient(145deg, #ffd3e4, #ffb7d2);
        padding: 16px;
        border-radius: 22px;
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.7),
          0 14px 32px rgba(118, 45, 78, 0.22);
      }

      .frame img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 16px;
        border: 4px solid rgba(255, 255, 255, 0.9);
        background: #fff;
      }

      .meta {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 0.95rem;
      }

      .meta a {
        color: #7b2d58;
        text-decoration: none;
      }

      .meta a.refresh {
        font-weight: 600;
      }

      .meta a:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .card {
          padding: 22px;
        }

        h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Dog break</h1>
      <p>One random pup, framed in pink, just because.</p>
      <div class="frame">
        <img src="{{ dog_url }}" alt="A random dog">
      </div>
      <div class="meta">
        <a class="refresh" href="/dog" data-refresh>Refresh for another friend.</a>
        <a href="/">Back home</a>
      </div>
    </main>
    <script>
      const refreshLink = document.querySelector("[data-refresh]");
      if (refreshLink) {
        refreshLink.addEventListener("click", (event) => {
          event.preventDefault();
          const url = new URL(window.location.href);
          url.searchParams.set("t", Date.now().toString());
          window.location.href = url.toString();
        });
      }
    </script>
  </body>
</html>
